<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Spike Harness</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        background: #fff;

      button {
        margin: 2px 4px 2px 0;
      }
      #log {
        white-space: pre-wrap;

        overflow: auto;
      }

    <h1>In-browser LLM spike</h1>
    <div id="buttons"></div>

      <progress id="progress" max="1" value="0"></progress>

    <script type="module" src="./main.ts"></script>
