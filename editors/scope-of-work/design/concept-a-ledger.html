<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concept A — Ledger · Scope of Work</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --canvas: #f6f7f9;
        --panel: #ffffff;
        --panel-2: #f0f2f5;
        --ink: #1b2230;
        --ink-2: #5b6474;
        --ink-3: #8b94a5;
        --rule: #e1e5eb;
        --rule-2: #cbd2dc;
        --meridian: #0e8a7a;
        --meridian-soft: #ddf3ef;
        --signal: #d98a00;
        --signal-soft: #fbefd9;
        --ember: #c2412b;
        --ember-soft: #f9e1dc;
        --slate: #6b7a90;
        --slate-soft: #e7ebf1;
        --focus: #2f5bff;
        --r: 10px;
        --r-s: 6px;
        --display: "Bricolage Grotesque", Inter, system-ui, sans-serif;
        --ui: Inter, system-ui, sans-serif;
        --mono:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .dark {
        --canvas: #0f141b;
        --panel: #161c25;
        --panel-2: #1c2330;
        --ink: #e6eaf0;
        --ink-2: #9aa5b5;
        --ink-3: #6c778a;
        --rule: #263040;
        --rule-2: #33405a;
        --meridian: #2fb8a4;
        --meridian-soft: #12332e;
        --signal: #f0a72b;
        --signal-soft: #3a2e12;
        --ember: #e4644e;
        --ember-soft: #3e1f1a;
        --slate: #8c9ab0;
        --slate-soft: #232c3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font: 14px/1.45 var(--ui);
        color: var(--ink);
        background: var(--canvas);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 0;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
        letter-spacing: 0.01em;
      }
      .muted {
        color: var(--ink-2);
      }
      .faint {
        color: var(--ink-3);
      }
      /* ── shell ── */
      .app {
        display: grid;
        grid-template-rows: 52px 1fr;
        height: 100vh;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--rule);
      }
      .topbar .crumbs {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--ink-3);
        font-size: 12.5px;
      }
      .topbar .crumbs b {
        color: var(--ink-2);
        font-weight: 500;
      }
      .topbar .grow {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--rule-2);
        background: var(--panel);
        font-weight: 500;
        font-size: 13px;
      }
      .btn:hover {
        background: var(--panel-2);
      }
      .btn.primary {
        background: var(--ink);
        color: var(--canvas);
        border-color: var(--ink);
      }
      .btn.primary:hover {
        opacity: 0.92;
      }
      .btn.ghost {
        border-color: transparent;
      }
      .btn.sm {
        height: 26px;
        padding: 0 9px;
        font-size: 12.5px;
        border-radius: 7px;
      }
      .body {
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr) 372px;
        min-height: 0;
      }
      .body.no-inspector {
        grid-template-columns: 264px minmax(0, 1fr) 0;
      }
      /* ── rail ── */
      .rail {
        border-right: 1px solid var(--rule);
        background: var(--panel);
        overflow: auto;
        padding: 12px 10px;
      }
      .rail .sect {
        margin-top: 14px;
        padding: 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .rail .sect button {
        color: var(--ink-3);
        font-size: 12px;
      }
      .rail .sect button:hover {
        color: var(--ink);
      }
      .node {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 6px 8px;
        border-radius: 7px;
        color: var(--ink-2);
        font-size: 13px;
      }
      .node:hover {
        background: var(--panel-2);
        color: var(--ink);
      }
      .node.active {
        background: var(--slate-soft);
        color: var(--ink);
        font-weight: 500;
      }
      .node .code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
        min-width: 26px;
      }
      .node .cnt {
        margin-left: auto;
        font-size: 11px;
        color: var(--ink-3);
        font-family: var(--mono);
      }
      .node.child {
        padding-left: 26px;
        font-size: 12.5px;
      }
      .node.child .ring {
        margin-left: auto;
      }
      .ring {
        --p: 0;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: conic-gradient(
          var(--meridian) calc(var(--p) * 1%),
          var(--rule) 0
        );
        position: relative;
        flex: none;
      }
      .ring::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--panel);
      }
      /* ── canvas ── */
      .canvas {
        overflow: auto;
        padding: 28px 36px 80px;
      }
      .doc {
        max-width: 980px;
        margin: 0 auto;
      }
      .eyebrow {
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
        font-weight: 600;
      }
      h1.title {
        font-family: var(--display);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin: 6px 0 8px;
      }
      h2 {
        font-family: var(--display);
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin: 0;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
      }
      .editable {
        border-radius: 6px;
        padding: 2px 6px;
        margin-left: -6px;
        transition: background 0.12s;
      }
      .editable:hover {
        background: var(--panel-2);
        cursor: text;
      }
      .editable:focus {
        background: var(--panel);
        outline: 2px solid var(--focus);
      }
      .desc {
        max-width: 680px;
        color: var(--ink-2);
        font-size: 15px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
        background: var(--slate-soft);
        color: var(--ink-2);
        white-space: nowrap;
      }
      .chip::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.8;
      }
      .chip.DELIVERED,
      .chip.FINISHED,
      .chip.APPROVED {
        background: var(--meridian-soft);
        color: var(--meridian);
      }
      .chip.IN_PROGRESS,
      .chip.SUBMITTED {
        background: var(--signal-soft);
        color: var(--signal);
      }
      .chip.BLOCKED,
      .chip.REJECTED {
        background: var(--ember-soft);
        color: var(--ember);
      }
      .chip.CANCELED,
      .chip.WONT_DO {
        text-decoration: line-through;
        opacity: 0.7;
      }
      .chip.TODO {
        background: var(--slate-soft);
        color: var(--slate);
      }
      .chip.DRAFT {
        background: transparent;
        border: 1px dashed var(--rule-2);
        color: var(--ink-3);
      }
      .chip.DRAFT::before {
        display: none;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 7px;
        border-radius: 5px;
        font-size: 11.5px;
        font-weight: 500;
        background: var(--ember-soft);
        color: var(--ember);
      }
      .tag.warn {
        background: var(--signal-soft);
        color: var(--signal);
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 26px 0;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: var(--r);
        padding: 14px 16px;
      }
      .kpi .l {
        font-size: 12px;
        color: var(--ink-3);
      }
      .kpi .v {
        font-family: var(--display);
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin-top: 2px;
      }
      .kpi .s {
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 2px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: var(--r);
        padding: 18px 20px;
      }
      .section {
        margin-top: 34px;
      }
      .section .hd {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 12px;
      }
      .section .hd .grow {
        flex: 1;
      }
      /* delivery spine */
      .spine {
        position: relative;
        padding: 28px 0 8px;
        margin: 6px 0 4px;
      }
      .spine .line {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        height: 2px;
        background: var(--rule-2);
        border-radius: 2px;
      }
      .spine .fill {
        position: absolute;
        left: 0;
        top: 44px;
        height: 2px;
        background: var(--meridian);
        border-radius: 2px;
        transition: width 0.6s ease;
      }
      .spine .notches {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 8px;
      }
      .notch {
        position: relative;
        padding-top: 30px;
        text-align: left;
      }
      .notch .dot {
        position: absolute;
        left: 0;
        top: 9px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--rule-2);
      }
      .notch.done .dot {
        background: var(--meridian);
        border-color: var(--meridian);
      }
      .notch.live .dot {
        border-color: var(--signal);
        box-shadow: 0 0 0 4px var(--signal-soft);
      }
      .notch .code {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-3);
      }
      .notch .t {
        font-weight: 600;
        font-size: 13.5px;
        margin-top: 1px;
      }
      .notch .d {
        font-size: 12px;
        color: var(--ink-2);
      }
      .notch button {
        text-align: left;
        display: block;
        padding: 4px 6px 6px 0;
        border-radius: 6px;
      }
      .notch button:hover .t {
        color: var(--meridian);
      }
      .bar {
        height: 6px;
        background: var(--rule);
        border-radius: 4px;
        overflow: hidden;
        min-width: 60px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--meridian);
        border-radius: 4px;
        transition: width 0.4s;
      }
      .bar.signal i {
        background: var(--signal);
      }
      /* matrix */
      .matrix {
        display: grid;
        border: 1px solid var(--rule);
        border-radius: var(--r);
        overflow: hidden;
        background: var(--panel);
      }
      .matrix .c {
        padding: 10px;
        border-right: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        min-height: 64px;
      }
      .matrix .c:last-child {
        border-right: 0;
      }
      .matrix .h {
        background: var(--panel-2);
        font-size: 12px;
        color: var(--ink-2);
        min-height: 0;
      }
      .matrix .rh {
        background: var(--panel-2);
        font-size: 12.5px;
      }
      .matrix .rh .code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
      }
      .matrix .rh b {
        display: block;
        font-weight: 600;
        color: var(--ink);
      }
      .matrix .rh .money {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--ink-2);
        margin-top: 4px;
      }
      .mini {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: var(--panel);
        margin-bottom: 6px;
        cursor: pointer;
        font-size: 12.5px;
      }
      .mini:hover {
        border-color: var(--rule-2);
        background: var(--panel-2);
      }
      .mini.sel {
        border-color: var(--focus);
        box-shadow: 0 0 0 2px rgba(47, 91, 255, 0.15);
      }
      .mini .st {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--slate);
        flex: none;
      }
      .mini.DELIVERED .st {
        background: var(--meridian);
      }
      .mini.IN_PROGRESS .st {
        background: var(--signal);
      }
      .mini.BLOCKED .st {
        background: var(--ember);
      }
      .mini.CANCELED {
        opacity: 0.55;
        text-decoration: line-through;
      }
      .mini .code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-3);
      }
      .mini .t {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .mini .av {
        margin-left: auto;
      }
      .av {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--slate-soft);
        color: var(--ink-2);
        font-size: 10px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: none;
        border: 1px solid var(--panel);
      }
      .avs {
        display: inline-flex;
      }
      .avs .av + .av {
        margin-left: -6px;
      }
      /* rows / tables */
      .rows {
        border: 1px solid var(--rule);
        border-radius: var(--r);
        overflow: hidden;
        background: var(--panel);
      }
      .row {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr) 120px 140px 90px 28px;
        align-items: center;
        gap: 12px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--rule);
        cursor: pointer;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row:hover {
        background: var(--panel-2);
      }
      .row.sel {
        background: var(--slate-soft);
      }
      .row.hdr {
        font-size: 11.5px;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        cursor: default;
        background: var(--panel-2);
      }
      .row.hdr:hover {
        background: var(--panel-2);
      }
      .row .t {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row .sub {
        font-size: 12px;
        color: var(--ink-3);
        font-weight: 400;
        margin-top: 1px;
      }
      .row .money {
        font-family: var(--mono);
        font-size: 12.5px;
        text-align: right;
      }
      .add {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 14px;
        color: var(--ink-3);
        font-size: 13px;
        border-top: 1px dashed var(--rule);
      }
      .add:hover {
        color: var(--ink);
        background: var(--panel-2);
      }
      .ledger {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr) 110px 70px 70px 110px;
        gap: 12px;
        padding: 9px 14px;
        border-bottom: 1px solid var(--rule);
        align-items: center;
        cursor: pointer;
      }
      .ledger:hover {
        background: var(--panel-2);
      }
      .ledger.sel {
        background: var(--slate-soft);
      }
      .ledger.hdr,
      .ledger.tot {
        cursor: default;
        background: var(--panel-2);
      }
      .ledger.hdr {
        font-size: 11.5px;
        color: var(--ink-3);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .ledger .money {
        font-family: var(--mono);
        font-size: 12.5px;
        text-align: right;
      }
      .ledger.tot .money {
        font-weight: 600;
      }
      .ledger.tot {
        border-bottom: 0;
      }
      .vspine {
        position: relative;
        padding-left: 26px;
      }
      .vspine::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--rule-2);
      }
      .ms {
        position: relative;
        margin-bottom: 22px;
      }
      .ms::before {
        content: "";
        position: absolute;
        left: -26px;
        top: 6px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--rule-2);
      }
      .ms.done::before {
        background: var(--meridian);
        border-color: var(--meridian);
      }
      .ms.live::before {
        border-color: var(--signal);
        box-shadow: 0 0 0 4px var(--signal-soft);
      }
      .ms .hd {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .ms .hd .code {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink-3);
      }
      .ms .hd input[type="date"] {
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 2px 6px;
        background: transparent;
        color: var(--ink-2);
        font-size: 12.5px;
      }
      .ms .hd input[type="date"]:hover {
        border-color: var(--rule-2);
        background: var(--panel);
      }
      /* checklist */
      .check {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 20px;
        margin-top: 10px;
      }
      .ck {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--ink-2);
      }
      .ck i {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--rule-2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-style: normal;
        flex: none;
      }
      .ck.ok {
        color: var(--ink);
      }
      .ck.ok i {
        background: var(--meridian);
        border-color: var(--meridian);
        color: #fff;
      }
      .ck button {
        color: var(--focus);
        font-weight: 500;
        margin-left: auto;
        font-size: 12.5px;
      }
      /* inspector */
      .inspector {
        border-left: 1px solid var(--rule);
        background: var(--panel);
        overflow: auto;
        padding: 0;
      }
      .no-inspector .inspector {
        display: none;
      }
      .insp-hd {
        position: sticky;
        top: 0;
        background: var(--panel);
        padding: 14px 18px 10px;
        border-bottom: 1px solid var(--rule);
        z-index: 2;
      }
      .insp-hd .eyebrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .insp-hd .x {
        color: var(--ink-3);
        font-size: 16px;
        line-height: 1;
      }
      .insp-hd .x:hover {
        color: var(--ink);
      }
      .field {
        padding: 0 18px;
        margin-top: 14px;
      }
      .field label {
        display: block;
        font-size: 11.5px;
        color: var(--ink-3);
        margin-bottom: 5px;
        font-weight: 500;
      }
      .in {
        width: 100%;
        height: 34px;
        border: 1px solid var(--rule-2);
        border-radius: 8px;
        padding: 0 10px;
        background: var(--panel);
      }
      .in:focus {
        border-color: var(--focus);
        outline: 0;
      }
      textarea.in {
        height: auto;
        min-height: 64px;
        padding: 8px 10px;
        resize: vertical;
      }
      select.in {
        appearance: none;
        background-image:
          linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
          linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
        background-position:
          calc(100% - 14px) 14px,
          calc(100% - 9px) 14px;
        background-size: 5px 5px;
        background-repeat: no-repeat;
        padding-right: 28px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;

      };
      const allMilestones = () =>
        D.roadmaps.flatMap((r) =>
          r.milestones.map((m) => ({ ...m, roadmap: r })),
        );
      const milestoneOf = (did) =>
        allMilestones().find((m) => m.deliverables.includes(did));
      const projectOf = (did) =>
        D.projects.find((p) => p.deliverables.includes(did));
      const ignored = (d) => d.status === "CANCELED" || d.status === "WONT_DO";
      const pctOf = (d) => {
        const p = d.progress;
        if (!p) return 0;
        if (p.kind === "pct") return p.value;
        if (p.kind === "sp")
          return p.total > 0 ? (p.completed / p.total) * 100 : 0;
        return d.status === "IN_PROGRESS" ? 50 : p.done ? 100 : 0;
      };
      const isDone = (d) =>
        d.status === "DELIVERED" ||
        (d.progress?.kind === "bin" && d.progress.done);
      function rollup(ids) {
        const ds = ids.map(byId).filter((d) => d && !ignored(d));
        if (!ds.length) return { kind: "pct", pct: 0, total: 0, done: 0 };
        const allSP = ds.every((d) => d.progress?.kind === "sp");
        if (allSP) {
          const t = ds.reduce((a, d) => a + d.progress.total, 0),
            c = ds.reduce((a, d) => a + d.progress.completed, 0);
          return {
            kind: "sp",
            spTotal: t,
            spDone: c,
            pct: t ? (c / t) * 100 : 0,
            total: ds.length,
            done: ds.filter(isDone).length,
          };
        }
        return {
          kind: "pct",
          pct:
            Math.round(
              (ds.reduce((a, d) => a + pctOf(d), 0) / ds.length) * 100,
            ) / 100,
          total: ds.length,
          done: ds.filter(isDone).length,
        };
      }
      const cost = (d) =>
        d.anchor ? d.anchor.unitCost * d.anchor.quantity : 0;
      const budget = (d) =>
        d.anchor
          ? Math.round(cost(d) * (1 + d.anchor.margin / 100) * 100) / 100
          : 0;
      const sumBudget = (ids) =>
        ids
          .map(byId)
          .filter(Boolean)
          .reduce((a, d) => a + budget(d), 0);
      const sumCost = (ids) =>
        ids
          .map(byId)
          .filter(Boolean)
          .reduce((a, d) => a + cost(d), 0);

    <div class="field three"><div><label>Unit</label><select class="in" onchange="anchor('${d.id}',{unit:this.value})"><option value="Hours" ${d.anchor?.unit === "Hours" ? "selected" : ""}>Hours</option><option value="StoryPoints" ${d.anchor?.unit === "StoryPoints" ? "selected" : ""}>Story pts</option></select></div>
      <div><label>Unit cost</label><input type="number" class="in mono" min="0" value="${d.anchor?.unitCost ?? ""}" placeholder="0" onchange="anchor('${d.id}',{unitCost:+this.value})"></div>
      <div><label>Quantity</label><input type="number" class="in mono" min="0" value="${d.anchor?.quantity ?? ""}" placeholder="0" onchange="anchor('${d.id}',{quantity:+this.value})"></div></div>
    <div class="field"><label>Margin <span class="faint">%</span></label><input type="range" class="range" min="0" max="100" value="${d.anchor?.margin ?? 0}" oninput="anchor('${d.id}',{margin:+this.value})"><div class="mono muted" style="text-align:right">${d.anchor?.margin ?? 0}%</div></div>
    <div class="calc"><div><span>cost</span><span>${d.anchor ? `${d.anchor.unitCost} × ${d.anchor.quantity} = ${money(c, p?.currency)}` : "—"}</span></div><div><span>margin</span><span>${d.anchor ? `+ ${d.anchor.margin}% = ${money(b - c, p?.currency)}` : "—"}</span></div><div class="tot"><span>budget</span><span>${money(b, p?.currency)}</span></div></div>
    ${!p && d.anchor ? `<div class="hint err">Quoted but unfunded — pick a project so this budget rolls up somewhere.</div>` : ""}
    <div class="insp-sec">Key results</div>
    <div class="krs">${d.krs.map((k, i) => `<div class="kr"><span>${k.t}</span><a href="${k.l}">link</a></div>`).join("")}<button class="kr add" style="border-top:0" onclick="const t=prompt('Key result');if(t){byId('${d.id}').krs.push({t,l:'#'});render()}">+ Add key result</button></div>
    <div class="danger"><span>Created from ${p ? p.code : "nowhere"} · <kbd>Esc</kbd> closes</span><button onclick="removeDeliverable('${d.id}')">Remove deliverable</button></div>`;
      }
      // ─────────────────────────────── mutations (mirror the reducer actions) ───────────────────────────────
      function upd(id, patch) {
        Object.assign(byId(id), patch);
        render();
      }
      function setKind(id, k) {
        const d = byId(id);
        if (["CANCELED", "WONT_DO"].includes(d.status))
          return toast("Closed deliverables don't accept progress");
        d.progress =
          k === "pct"
            ? { kind: "pct", value: 0 }
            : k === "sp"
              ? { kind: "sp", total: 10, completed: 0 }
              : { kind: "bin", done: false };
        if (d.status !== "DELIVERED") d.status = "IN_PROGRESS";
        render();
      }
      function afterProgress(d) {
        d.status = isDone(d) ? "DELIVERED" : "IN_PROGRESS";
      }
      function setPct(id, v) {
        const d = byId(id);
        d.progress = { kind: "pct", value: +v };
        afterProgress(d);
        render();
      }
      function setSP(id, c, t) {
        const d = byId(id);
        const p = d.progress;
        const nc = c === null ? p.completed : +c,
          nt = t === null ? p.total : +t;
        if (nc > nt || nc < 0 || nt < 0) {
          toast("Story points: completed must be ≤ total");
          return render();
        }
        d.progress = { kind: "sp", total: nt, completed: nc };
        afterProgress(d);
        render();
      }
      function setDone(id, v) {
        const d = byId(id);
        d.progress = { kind: "bin", done: !!v };
        afterProgress(d);
        render();
      }
      function schedule(id, mid) {
        allMilestones().forEach((m) => {
          const real = milestone(m.id);
          real.deliverables = real.deliverables.filter((x) => x !== id);
        });
        if (mid) milestone(mid).deliverables.push(id);
        render();
        toast(mid ? "Scheduled" : "Unscheduled");
      }
      function fund(id, pid) {
        D.projects.forEach(
          (p) => (p.deliverables = p.deliverables.filter((x) => x !== id)),
        );
        const d = byId(id);
        if (pid) {
          project(pid).deliverables.push(id);
          d.anchor = d.anchor || {
            unit: "Hours",
            unitCost: 0,
            quantity: 0,
            margin: 0,
          };
        }
        render();
        toast(pid ? "Funded by " + project(pid).code : "Unfunded");
      }
      function anchor(id, patch) {
        const d = byId(id);
        d.anchor = {
          unit: "Hours",
          unitCost: 0,
          quantity: 0,
          margin: 0,
          ...(d.anchor || {}),
          ...patch,
        };
        if (
          d.anchor.unitCost < 0 ||
          d.anchor.quantity < 0 ||
          d.anchor.margin < 0
        ) {
          toast("Quotes must be zero or positive");
          return;
        }
        render();
      }
      function setTotalBudget(pid, v) {
        const p = project(pid);
        const total = +v;
        const c = sumCost(p.deliverables);
        if (!c) return toast("Quote at least one deliverable first");
        if (total < c)
          return toast(
            `Total budget cannot be below cost (${money(c, p.currency)})`,
          );
        const margin = Math.round((total / c - 1) * 1000) / 10;
        p.deliverables.map(byId).forEach((d) => {
          if (d.anchor) d.anchor.margin = margin;
        });
        render();
        toast(`Margins set to ${margin}% → ${money(total, p.currency)}`);
      }
      function addDeliverable({ milestone: mid, project: pid }) {
        const id = newId("d");
        const d = {
          id,
          code: "",
          title: "",
          owner: null,
          status: "DRAFT",
          description: "",
          progress: { kind: "pct", value: 0 },
          anchor: pid
            ? { unit: "Hours", unitCost: 0, quantity: 0, margin: 0 }
            : null,
          krs: [],
        };
        D.deliverables.push(d);
        if (mid) milestone(mid).deliverables.push(id);
        if (pid) project(pid).deliverables.push(id);
        S.sel = id;
        render();
        setTimeout(
          () =>
            $(
              "#inspector input[placeholder='What will be delivered?']",
            )?.focus(),
          0,
        );
      }
      function removeDeliverable(id) {
        if (!confirm("Remove this deliverable everywhere?")) return;
        D.deliverables = D.deliverables.filter((d) => d.id !== id);
        D.projects.forEach(
          (p) => (p.deliverables = p.deliverables.filter((x) => x !== id)),
        );
        D.roadmaps.forEach((r) =>
          r.milestones.forEach(
            (m) => (m.deliverables = m.deliverables.filter((x) => x !== id)),
          ),
        );
        S.sel = null;
        render();
      }
      function addMilestone(rid) {
        const r = D.roadmaps.find((x) => x.id === rid);
        const n = r.milestones.length + 1;
        r.milestones.push({
          id: newId("m"),
          code: (r.milestones[0]?.code.replace(/\d+$/, "") || "M") + n,
          title: "New milestone",
          target: "2027-01-31",
          coordinators: [],
          deliverables: [],
        });
        render();
      }
      function addRoadmap() {
        const id = newId("r");
        D.roadmaps.push({
          id,
          title: "New roadmap",
          description: "",
          milestones: [],
        });
        go("roadmap", id);
      }
      function addProject() {
        const id = newId("p");
        D.projects.push({
          id,
          code: "NEW",
          title: "New project",
          owner: null,
          currency: "USD",
          budgetType: "OPEX",
          abstract: "",
          deliverables: [],
        });
        go("project", id);
      }
      function addAgent() {
        const n = prompt("Contributor name");
        if (!n) return;
        D.contributors.push({
          id: "phd:" + n.toLowerCase().replace(/\s+/g, "-"),
          name: n,
          role: "",
        });
        render();
      }
      // ─────────────────────────────── render ───────────────────────────────
      function render() {
        renderRail();
        const v = S.view;
        $("#canvas").innerHTML =
          v.kind === "overview"
            ? viewOverview()
            : v.kind === "roadmap"
              ? viewRoadmap(v.id)
              : v.kind === "milestone"
                ? viewMilestone(v.id)
                : v.kind === "project"
                  ? viewProject(v.id)
                  : v.kind === "deliverables"
                    ? viewDeliverables()
                    : viewTeam();
        renderInspector();
        $("#crumbTitle").textContent = D.title;
        const sc = $("#sowStatusChip");
        sc.className = "chip " + D.status;
        sc.textContent = STATUS_LABEL[D.status];
        $("#submitBtn").style.display =
          D.status === "DRAFT" || D.status === "IN_PROGRESS" ? "" : "none";
      }
      $("#themeBtn").onclick = () =>
        document.documentElement.classList.toggle("dark");
      $("#submitBtn").onclick = () => {
        D.status = "SUBMITTED";
        render();
        toast("Submitted for review");
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") select(null);
      });
      render();
    </script>
  </body>
</html>
