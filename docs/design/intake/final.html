ht be drawn to the pictures to make sure you are on the right site. You might choose to look for the search option to type in 'Eames chair.' You might also scan the page for words such as 'furniture,' or for the word 'chair,' from which you might look for the appropriate category of chair. If you don't find 'chair,' you might look for other words that might represent a category that includes chairs. Let's suppose on scanning the options shown in Figure 1 - 2 ,  you  pick  the 'Living' option.\n\n## FIGURE", "total": 2543}, "Emotion": {"chars": 3069, "md": "## Exposing Secrets\n\nIf you've made it this far, chances are you've learned a lot about the six types of mental processes I'd like you to focus on. As a reminder, here are the things you should think about with regard to  your target customers:\n\n## Vision/Attention\n\nWhat is attracting your customers' attention? What are the words, images, and objects they are looking for?\n\n## Wayfinding\n\nHow are customers representing where they are (whether in the physical world, an app, or virtual space)? How do they believe they can interact with and navigate in this space?\n\n## Memory\n\nWhat are the past experiences customers are using to frame and understand what they are experiencing? What are mental models/ stereotypes that are forming their expectations about how things should work and what happens next?\n\n## Language\n\nWhat  are  the  words  your  customers  are  using?  What  do  those words,  and  their  associated  meanings  according  to  the  customers, say about their level of expertise (thereby suggesting how they might want to be engaged by you)?\n\n## Decision Making\n\nWhat is the problem your customers think they need to solve? How does that differ from the actual problem? How do they think they can get to the solution? What subproblems do they need solve and what decisions do they need to make along the way?\n\n## Emotion\n\nWhat are your customers'  deep-seated  goals,  desires,  and ", "total":   <div class="mf"><span>This is the source's content exactly as it will be written — tables intact.</span><div class="nav"><button class="btn ghost" data-nav="-1" ${readerIndex === 0 ? "disabled" : ""}>← previous part</button><button class="btn ghost" data-nav="1" ${readerIndex >= BOOK.sections.length - 1 ? "disabled" : ""}>next part →</button><button class="btn" data-close>Back to review</button></div></div></div>`; };
const rerender = () => { const el = document.querySelector(".detail"); if (el) el.outerHTML = review(FILES[0]); };
document.addEventListener("click", (e) => { const t = e.target.closest("[data-open],[data-full],[data-close],[data-nav],[data-tick]"); if (!t) return;
 if (t.dataset.open !== undefined) { const s = BOOK.sections.find(x => x.t === t.dataset.open); s.open = !s.open; rerender(); }
 else if (t.dataset.full !== undefined) openReader(t.dataset.full);
 else if (t.dataset.close !== undefined) closeReader();
 else if (t.dataset.nav !== undefined) { readerIndex = Math.max(0, Math.min(BOOK.sections.length - 1, readerIndex + Number(t.dataset.nav))); renderReader(); }
 else if (t.dataset.tick !== undefined) { const s = BOOK.sections.find(x => x.t === t.dataset.tick); s.on = t.checked; rerender(); } });
document.addEventListener("keydown", (e) => { if (!modal.classList.contains("on")) return;
 if (e.key === "Escape") closeReader(); if (e.key === "ArrowRight" && readerIndex < BOOK.sections.length - 1) { readerIndex++; renderReader(); } if (e.key === "ArrowLeft" && readerIndex > 0) { readerIndex--; renderReader(); } });

document.getElementById("states").innerHTML=[["landing","1 · empty / landing"],["batch","2–3 · batch + review"],["done","4a · one file published, others converting"],["complete","4b · all in the vault → Finish"],["finished","5 · panel closed, sources only"]].map(([k,l])=>`<a href="#${k}" class="${k===state?"on":""}" onclick="setTimeout(()=>location.reload(),0)">${l}</a>`).join("");
</script></body></html>
