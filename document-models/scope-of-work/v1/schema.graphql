type ScopeOfWorkState {
  title: String!
  description: String!
  status: ScopeOfWorkStatus!
  deliverables: [Deliverable!]!
  projects: [Project!]!
  roadmaps: [Roadmap!]!
  contributors: [Agent!]!
}

enum ScopeOfWorkStatus {
  DRAFT
  SUBMITTED
  IN_PROGRESS
  REJECTED
  APPROVED
  DELIVERED
  CANCELED
}

type Agent {
  id: PHID!
  name: String!
  icon: URL
  description: String
}

type Deliverable {
  id: OID!
  owner: ID
  icon: String
  title: String!
  code: String!
  description: String!
  status: DeliverableStatus!
  workProgress: Progress
  keyResults: [KeyResult!]!
  budgetAnchor: BudgetAnchorProject
  # the goal (in the anchoring project's WBS) whose subtree delivers this
  # deliverable; null until the work is compiled into a scope
  goalRef: OID
}

type BudgetAnchorProject {
  project: OID
  unit: Unit
  unitCost: Float!
  quantity: Float!
  margin: Float!
  # true when the margin was set by a person; false/null when it is derived from a fixed project budget
  marginPinned: Boolean
}

enum Unit {
  StoryPoints
  Hours
}

enum DeliverableStatus {
  WONT_DO
  DRAFT
  TODO
  BLOCKED
  IN_PROGRESS
  DELIVERED
  CANCELED
}

# Work progress. Exactly one representation is populated:
#   percentage   -> value
#   story points -> total + completed
#   binary       -> done
type Progress {
  value: Float
  total: Int
  completed: Int
  done: Boolean
}

type KeyResult {
  id: OID!
  title: String!
  link: String!
}

type Project {
  id: OID!
  slug: String!
  code: String!
  title: String!
  projectOwner: ID
  abstract: String
  imageUrl: URL
  scope: DeliverablesSet
  budgetType: BudgetType
  currency: PMCurrency
  budget: Float
  # when set, the project budget is fixed at this envelope and unpinned margins are derived from it
  targetBudget: Float
  expenditure: BudgetExpenditure
  # execution links — the work that delivers this envelope (see bai/wbs) and
  # the vault notes/MOCs and external references that inform it
  wbsRef: PHID
  knowledgeRefs: [PHID!]!
  references: [URL!]!
}

enum PMCurrency {
  DAI
  USDS
  EUR
  USD
}

enum BudgetType {
  CONTINGENCY
  OPEX
  CAPEX
  OVERHEAD
}

type BudgetExpenditure {
  percentage: Float!
  actuals: Float!
  cap: Float!
}

type Roadmap {
  id: OID!
  slug: String!
  title: String!
  description: String!
  milestones: [Milestone!]!
}

type Milestone {
  id: OID!
  sequenceCode: String!
  title: String!
  description: String!
  deliveryTarget: String!
  scope: DeliverablesSet
  coordinators: [ID!]!
  budget: Float
}

type DeliverablesSet {
  deliverables: [OID!]!
  status: DeliverableSetStatus!
  progress: Progress!
  deliverablesCompleted: DeliverablesCompleted!
}

type DeliverablesCompleted {
  total: Int!
  completed: Int!
}

enum DeliverableSetStatus {
  DRAFT
  TODO
  IN_PROGRESS
  FINISHED
  CANCELED
}

